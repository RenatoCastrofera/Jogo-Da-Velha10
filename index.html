<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s ease-out; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <h1 class="text-3xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">JOGO DA VELHA</h1>
    
    <div class="flex flex-col items-center gap-4 mb-6 w-full">
        <div class="flex gap-8 text-xl bg-slate-800 px-6 py-3 rounded-xl border border-slate-700">
            <p>X: <span id="scoreX" class="font-bold text-cyan-400">0</span></p>
            <p>O: <span id="scoreO" class="font-bold text-rose-400">0</span></p>
        </div>
        
        <label class="flex items-center gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700 cursor-pointer w-full max-w-[320px] justify-center">
            <input type="checkbox" id="vsComputer" class="w-6 h-6 accent-cyan-500 cursor-pointer"> 
            <span class="text-lg font-bold text-slate-300">Jogar contra Computador</span>
        </label>
    </div>

    <div id="message" class="mb-4 h-10 flex items-center justify-center font-black text-2xl text-yellow-400 uppercase"></div>

    <div id="board" class="grid grid-cols-3 gap-3 w-full max-w-[320px]"></div>

    <script>
        let board = Array(9).fill("");
        let currentPlayer = "X";
        let scores = { X: 0, O: 0 };
        const boardEl = document.getElementById("board");
        const msgEl = document.getElementById("message");
        const vsComp = document.getElementById("vsComputer");

        let audioCtx;
        function playTone(freq, duration) {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function createBoard() {
            boardEl.innerHTML = "";
            board.forEach((val, i) => {
                const btn = document.createElement("button");
                const colorClass = val === "X" ? "text-cyan-400" : "text-rose-400";
                btn.className = `h-24 bg-slate-800 rounded-xl text-4xl font-black flex items-center justify-center hover:bg-slate-700 transition shadow-lg border border-slate-700 ${colorClass} animate-pop`;
                btn.innerText = val;
                btn.onclick = () => handleMove(i);
                boardEl.appendChild(btn);
            });
        }

        function handleMove(i) {
            if (board[i] !== "" || msgEl.innerText !== "") return;
            
            // 1. Executa a jogada do jogador atual
            board[i] = currentPlayer;
            playTone(currentPlayer === "X" ? 400 : 300, 0.1);
            createBoard();
            
            // 2. Verifica se o jogo acabou antes de trocar o turno
            if (checkWinner()) return;

            // 3. Alterna o turno
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            
            // 4. Se o modo computador estiver ligado e agora for a vez do O, faz a jogada dele
            if (vsComp.checked && currentPlayer === "O") {
                setTimeout(computerMove, 500);
            }
        }

        function computerMove() {
            let empty = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                let move = empty[Math.floor(Math.random() * empty.length)];
                board[move] = "O";
                playTone(300, 0.1);
                createBoard();
                
                if (!checkWinner()) {
                    currentPlayer = "X"; // Devolve a vez para o humano
                }
            }
        }

        function checkWinner() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let [a,b,c] of wins) {
                if(board[a] && board[a] === board[b] && board[a] === board[c]) {
                    playTone(600, 0.5);
                    msgEl.innerText = "Jogador " + board[a] + " venceu!";
                    scores[board[a]]++;
                    document.getElementById("score" + board[a]).innerText = scores[board[a]];
                    setTimeout(reset, 2000);
                    return true;
                }
            }
            if(!board.includes("")) { 
                playTone(200, 0.5);
                msgEl.innerText = "Empate!"; 
                setTimeout(reset, 2000);
                return true;
            }
            return false;
        }

        function reset() { board = Array(9).fill(""); currentPlayer = "X"; msgEl.innerText = ""; createBoard(); }
        createBoard();
    </script>
</body>
</html>
