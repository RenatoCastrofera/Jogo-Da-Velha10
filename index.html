<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cell {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .cell:hover:not(.taken) {
            background-color: #f3f4f6;
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.2s ease-out; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div id="modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-8 shadow-2xl text-center transform transition-all scale-95 max-w-sm w-full">
            <h2 id="modalTitle" class="text-3xl font-black text-slate-800 mb-4">Parabéns!</h2>
            <p id="modalMessage" class="text-lg text-slate-600 mb-6"></p>
            <button onclick="resetGame()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg">
                Jogar Novamente
            </button>
        </div>
    </div>

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
        <h1 class="text-3xl font-bold text-slate-800 text-center mb-6">Jogo da Velha</h1>
        
        <div class="flex justify-between items-center bg-slate-100 p-4 rounded-xl mb-6">
            <div class="text-center">
                <p class="text-xs font-bold text-slate-500 uppercase">Vitórias X</p>
                <span id="scoreX" class="text-2xl font-black text-blue-600">0</span>
            </div>
            <div class="text-center">
                <p class="text-xs font-bold text-slate-500 uppercase">Vitórias O</p>
                <span id="scoreO" class="text-2xl font-black text-orange-500">0</span>
            </div>
        </div>
        
        <!-- Banner de Apoio -->
        <div class="mb-6 flex justify-center">
            <a href="https://beta.publishers.adsterra.com/referral/fx5atssTxC" rel="nofollow" class="hover:opacity-90 transition transform hover:scale-105 duration-200">
                <img alt="banner" src="https://landings-cdn.adsterratech.com/referralBanners/png/300%20x%20250%20px.png" class="rounded-lg shadow-md" />
            </a>
        </div>
        
        <div id="status" class="text-center text-lg font-semibold text-slate-600 mb-6">
            Vez de: <span id="currentPlayerLabel" class="text-blue-600">X</span>
        </div>

        <div class="grid grid-cols-3 gap-3 mb-8" id="board">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="resetGame()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-xl transition duration-200">
                Reiniciar
            </button>
            <button onclick="resetScore()" class="bg-red-100 hover:bg-red-200 text-red-600 font-bold py-3 px-4 rounded-xl transition duration-200">
                Zerar Placar
            </button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let isGameActive = true;
        let scores = { X: 0, O: 0 };

        const boardElement = document.getElementById('board');
        const currentPlayerLabel = document.getElementById('currentPlayerLabel');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const scoreX = document.getElementById('scoreX');
        const scoreO = document.getElementById('scoreO');

        function playTone(freq, type, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playMoveSound() { playTone(440, 'sine', 0.1); }
        function playWinSound() { playTone(523.25, 'square', 0.2); setTimeout(() => playTone(659.25, 'square', 0.3), 200); }
        function playDrawSound() { playTone(200, 'sawtooth', 0.3); }

        function createBoard() {
            boardElement.innerHTML = '';
            board.forEach((cell, index) => {
                const div = document.createElement('div');
                div.className = "cell h-24 border-2 border-slate-200 rounded-xl flex items-center justify-center text-4xl font-bold text-slate-700 shadow-sm " + (cell !== "" ? "animate-pop" : "");
                div.textContent = cell;
                if(cell !== "") div.classList.add('taken');
                div.onclick = () => handleMove(index);
                boardElement.appendChild(div);
            });
        }

        function handleMove(index) {
            if (board[index] !== "" || !isGameActive) return;

            playMoveSound();
            board[index] = currentPlayer;
            createBoard();
            
            if (!checkWinner()) {
                currentPlayer = currentPlayer === "X" ? "O" : "X";
                currentPlayerLabel.textContent = currentPlayer;
                currentPlayerLabel.className = currentPlayer === "X" ? "text-blue-600" : "text-orange-500";
            }
        }

        function checkWinner() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];

            for (let pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    isGameActive = false;
                    playWinSound();
                    scores[board[a]]++;
                    updateScoreboard();
                    showModal(`Jogador ${board[a]} venceu! 🎉`);
                    return true;
                }
            }

            if (!board.includes("")) {
                isGameActive = false;
                playDrawSound();
                showModal("Empate! Ninguém venceu desta vez.");
                return true;
            }
            return false;
        }

        function updateScoreboard() {
            scoreX.textContent = scores.X;
            scoreO.textContent = scores.O;
        }

        function resetScore() {
            scores = { X: 0, O: 0 };
            updateScoreboard();
        }

        function showModal(message) {
            modalTitle.textContent = "Fim de Jogo";
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        function resetGame() {
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = "X";
            isGameActive = true;
            currentPlayerLabel.textContent = "X";
            currentPlayerLabel.className = "text-blue-600";
            modal.classList.add('hidden');
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
