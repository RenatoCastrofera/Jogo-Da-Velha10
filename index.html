    <script>
        const WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        let board = Array(9).fill("");
        let currentPlayer = "X";
        let scoreX = 0, scoreO = 0, scoreD = 0;
        let gameActive = true;
        let gamesFinished = Number(localStorage.getItem('ttt_gamesFinished') || 0);

        function vsComputer() { return document.getElementById('modeToggle').checked; }
        function difficulty() { return document.getElementById('difficulty').value; }
        function labelOf(player) { return (player === "O" && vsComputer()) ? "Computador" : player; }

        function onModeChange() {
            document.getElementById('difficulty').classList.toggle('hidden', !vsComputer());
            resetGame();
        }

        function play(index) {
            if (!gameActive || board[index] !== "") return;
            if (vsComputer() && currentPlayer === "O") return; // impede clique durante a vez do computador

            board[index] = currentPlayer;
            render();
            if (checkEnd()) return;
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            updateStatus();
            if (vsComputer() && currentPlayer === "O" && gameActive) setTimeout(aiMove, 500);
        }

        function aiMove() {
            if (!gameActive) return;
            const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (available.length === 0) return;

            let move;
            const level = difficulty();
            if (level === 'facil') {
                move = available[Math.floor(Math.random() * available.length)];
            } else if (level === 'medio') {
                move = Math.random() < 0.5 ? bestMove() : available[Math.floor(Math.random() * available.length)];
            } else {
                move = bestMove(); // impossível: minimax puro, nunca perde
            }

            board[move] = "O";
            render();
            if (checkEnd()) return;
            currentPlayer = "X";
            updateStatus();
        }

        // ---- IA: minimax (imbatível no nível "Impossível") ----
        function winnerOf(bd) {
            for (const [a,b,c] of WIN_LINES) {
                if (bd[a] && bd[a] === bd[b] && bd[a] === bd[c]) return bd[a];
            }
            if (!bd.includes("")) return "empate";
            return null;
        }

        function minimax(bd, depth, isMaximizing) {
            const result = winnerOf(bd);
            if (result === "O") return 10 - depth;
            if (result === "X") return depth - 10;
            if (result === "empate") return 0;

            if (isMaximizing) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) {
                    if (bd[i] === "") {
                        bd[i] = "O";
                        best = Math.max(best, minimax(bd, depth + 1, false));
                        bd[i] = "";
                    }
                }
                return best;
            } else {
                let best = Infinity;
                for (let i = 0; i < 9; i++) {
                    if (bd[i] === "") {
                        bd[i] = "X";
                        best = Math.min(best, minimax(bd, depth + 1, true));
                        bd[i] = "";
                    }
                }
                return best;
            }
        }

        function bestMove() {
            let bestScore = -Infinity, move = -1;
            for (let i = 0; i < 9; i++) {
                if (board[i] === "") {
                    board[i] = "O";
                    const score = minimax(board, 0, false);
                    board[i] = "";
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => {
                cells[i].innerText = val;
                cells[i].className = `cell bg-gray-700 rounded-lg text-4xl font-bold ${val === 'X' ? 'text-blue-400' : 'text-red-400'}`;
                cells[i].disabled = val !== "" || !gameActive;
            });
        }

        function checkEnd() {
            const cells = document.querySelectorAll('.cell');
            for (const c of WIN_LINES) {
                if (board[c[0]] && board[c[0]] === board[c[1]] && board[c[0]] === board[c[2]]) {
                    gameActive = false;
                    board[c[0]] === 'X' ? scoreX++ : scoreO++;
                    saveScore();
                    document.getElementById('status').innerText = `🏆 ${labelOf(board[c[0]])} venceu!`;
                    render();
                    c.forEach(i => cells[i].classList.add('winning-cell'));
                    onGameFinished();
                    return true;
                }
            }
            if (!board.includes("")) {
                gameActive = false;
                scoreD++;
                saveScore();
                document.getElementById('status').innerText = "🤝 Empate!";
                render();
                onGameFinished();
                return true;
            }
            return false;
        }

        function onGameFinished() {
            gamesFinished++;
            localStorage.setItem('ttt_gamesFinished', gamesFinished);
            if (gamesFinished % 3 === 0) {
                document.getElementById('ad-break-modal').classList.remove('hidden');
            }
        }

        function closeAdBreak() {
            document.getElementById('ad-break-modal').classList.add('hidden');
        }

        function updateStatus() {
            if (!gameActive) return;
            document.getElementById('status').innerText = `Vez de: ${labelOf(currentPlayer)}`;
        }

        function updatePlacar() {
            document.getElementById('placar').innerText = `X: ${scoreX} | O: ${scoreO} | Empates: ${scoreD}`;
        }

        function saveScore() {
            localStorage.setItem('ttt_scoreX', scoreX);
            localStorage.setItem('ttt_scoreO', scoreO);
            localStorage.setItem('ttt_scoreD', scoreD);
            updatePlacar();
        }

        function loadScore() {
            scoreX = Number(localStorage.getItem('ttt_scoreX') || 0);
            scoreO = Number(localStorage.getItem('ttt_scoreO') || 0);
            scoreD = Number(localStorage.getItem('ttt_scoreD') || 0);
            updatePlacar();
        }

        function resetGame() {
            board = Array(9).fill("");
            gameActive = true;
            currentPlayer = "X";
            render();
            updateStatus();
        }

        function resetScore() {
            scoreX = 0;
            scoreO = 0;
            scoreD = 0;
            saveScore();
        }

        function shareWhatsApp() {
            const url = 'https://renatocastrofera.github.io/Jogo-Da-Velha10/';
            const texto = `Te desafio no Jogo da Velha! IA imbatível no modo Impossível 😏 Bora ver se você me vence: ${url}`;
            const link = `https://wa.me/?text=${encodeURIComponent(texto)}`;
            window.open(link, '_blank');
        }

        loadScore();
        resetGame();
    </script>
