<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <h1 class="text-3xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">JOGO DA VELHA</h1>
    
    <div class="flex gap-8 mb-6 text-xl bg-slate-800 px-6 py-3 rounded-xl border border-slate-700">
        <p>X: <span id="scoreX" class="font-bold text-cyan-400">0</span></p>
        <p>O: <span id="scoreO" class="font-bold text-rose-400">0</span></p>
    </div>

    <div id="message" class="mb-4 h-8 font-bold text-lg text-yellow-400"></div>

    <div id="board" class="grid grid-cols-3 gap-3 w-full max-w-[320px]">
    </div>

    <script>
        let board = Array(9).fill("");
        let currentPlayer = "X";
        let scores = { X: 0, O: 0 };
        const boardEl = document.getElementById("board");
        const msgEl = document.getElementById("message");
        
        // Configuração de Áudio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, duration) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function createBoard() {
            boardEl.innerHTML = "";
            board.forEach((val, i) => {
                const btn = document.createElement("button");
                const colorClass = val === "X" ? "text-cyan-400" : "text-rose-400";
                btn.className = `h-24 bg-slate-800 rounded-xl text-4xl font-black flex items-center justify-center hover:bg-slate-700 transition shadow-lg border border-slate-700 ${colorClass}`;
                btn.innerText = val;
                btn.onclick = () => handleMove(i);
                boardEl.appendChild(btn);
            });
        }

        function handleMove(i) {
            if (board[i] !== "" || msgEl.innerText !== "") return;
            
            playTone(400, 0.1); // Som de clique
            board[i] = currentPlayer;
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            createBoard();
            checkWinner();
        }

        function checkWinner() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let [a,b,c] of wins) {
                if(board[a] && board[a] === board[b] && board[a] === board[c]) {
                    playTone(600, 0.3); // Som de vitória
                    msgEl.innerText = "Jogador " + board[a] + " venceu!";
                    scores[board[a]]++;
                    document.getElementById("score" + board[a]).innerText = scores[board[a]];
                    setTimeout(reset, 2000);
                    return;
                }
            }
            if(!board.includes("")) { 
                playTone(200, 0.3); // Som de empate
                msgEl.innerText = "Empate!"; 
                setTimeout(reset, 2000);
            }
        }

        function reset() { 
            board = Array(9).fill(""); 
            msgEl.innerText = "";
            createBoard(); 
        }
        createBoard();
    </script>
</body>
</html>
